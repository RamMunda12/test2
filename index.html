<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML + CSS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flavor-picker-container">
      <div class="flavor-scroller">
          <div class="flavor-item">Chocolate</div>
          <div class="flavor-item">Vanilla</div>
          <div class="flavor-item">Strawberry</div>
          <div class="flavor-item">Café Latte</div>
          <div class="flavor-item sold-out">Cookies Cream</div>
      </div>
    </div>
    <div class="scrollbar-container">
        <div class="scrollbar-thumb"></div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
    const scroller = document.querySelector('.flavor-scroller');
    const thumb = document.querySelector('.scrollbar-thumb');

    const updateScrollbar = () => {
        const ratio = scroller.offsetWidth / scroller.scrollWidth;
        const scrollPercent = scroller.scrollLeft / (scroller.scrollWidth - scroller.clientWidth);
        thumb.style.width = `${ratio * 100}%`;
        thumb.style.left = `${scrollPercent * (100 - (ratio * 100))}%`;
    };

    scroller.addEventListener('scroll', updateScrollbar);

    // Trigger the initial update
    updateScrollbar();
});

    </script>
  
  </body>
</html>
